name: macOS validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Toolchain
        run: swift --version
      - name: Source audit
        run: ./scripts/audit-source.py
      - name: Tests
        run: swift test
      - name: Universal preview package
        run: ./scripts/package-release.sh --preview
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Tern-universal-preview
          path: dist/Tern-*-preview-universal.zip*
          if-no-files-found: error
